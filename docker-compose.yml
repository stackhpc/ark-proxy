---
services:
  package-cache:
    image: nginx:stable
    container_name: package-cache
    ports:
      - "80:80"
    volumes:
      - cache_data:/var/cache/nginx
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: always
  docker-registry:
    image: registry:3
    container_name: docker-registry
    restart: always
    ports:
      - "5000:5000"
      - "5001:5001"
    volumes:
      - registry_data:/var/lib/registry
      - ./config.yml:/etc/distribution/config.yml:ro

volumes:
   registry_data:
      name: container_registry_data
   cache_data:
      name: package_cache_data
