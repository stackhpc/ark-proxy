version: 0.1
log:
  level: info
  formatter: text
  fields:
    service: registry
    environment: production
proxy:
  remoteurl: https://ark.stackhpc.com
  username: <username>
  password: <password>
storage:
    delete:
      enabled: true
    cache:
        blobdescriptor: inmemory
    filesystem:
        rootdirectory: /var/lib/registry
    tag:
      concurrencylimit: 20
http:
    addr: :5000
    debug:
        addr: :5001
        prometheus:
            enabled: true
            path: /metrics
health:
  storagedriver:
    enabled: true
    interval: 10s
    threshold: 3
