# Pull-through cache for Ansible Galaxy (galaxy.ansible.com).
#
# Point ansible-galaxy at http://<cache-host>:8080/api/ (include /api/ so the
# client doesn't probe the Galaxy web UI at /).
#
# Reuses the repo_cache zone defined in default.conf. Keys are prefixed with
# "galaxy" so they can't collide with Ark entries.

server {
    listen 8080;
    server_name galaxy_cache;

    access_log /dev/stdout;

    resolver 8.8.8.8 1.1.1.1 valid=300s ipv6=off;

    # --- Caching behaviour (inherited by all locations) ---
    proxy_cache repo_cache;
    proxy_cache_key galaxy$request_uri;
    proxy_cache_lock on;
    proxy_cache_revalidate on;
    proxy_cache_background_update on;
    # Galaxy outages are the reason this exists: serve whatever we have,
    # however old, if Galaxy is erroring, timing out or rate limiting us.
    proxy_cache_use_stale error timeout updating http_429 http_500 http_502 http_503 http_504;
    proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
    proxy_hide_header Set-Cookie;

    # --- Upstream connection ---
    proxy_ssl_server_name on;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;
    proxy_set_header Host galaxy.ansible.com;
    # Uncompressed responses so sub_filter can rewrite them.
    proxy_set_header Accept-Encoding "";

    # Galaxy returns absolute URLs (download_url, redirects). Rewrite them to
    # point back at this cache, otherwise clients bypass it for downloads.
    # Both are applied per request, so cached entries work for any client
    # hostname.
    proxy_redirect https://galaxy.ansible.com/ $scheme://$http_host/;
    sub_filter_types application/json;
    sub_filter_once off;
    sub_filter "https://galaxy.ansible.com/" "$scheme://$http_host/";

    add_header X-Cache-Status $upstream_cache_status always;

    # Galaxy can be slooow
    proxy_read_timeout 300s;

    # --- Mutable: API root, collection indices, version lists, v1 role lookups ---
    # Short TTL so new releases show up; stale copies cover outages.
    location / {
        proxy_cache_valid 200 301 302 1h;
        proxy_pass https://galaxy.ansible.com;
    }

    # --- Immutable: metadata for a specific collection version ---
    location ~ ^/api/v3/plugin/ansible/content/[^/]+/collections/index/[^/]+/[^/]+/versions/[^/]+/$ {
        proxy_cache_valid 200 60d;
        proxy_pass https://galaxy.ansible.com;
    }

    # --- Immutable: collection tarballs ---
    # Galaxy redirects these (possibly via more than one hop) to S3 with an
    # expiring signed URL. Every hop is followed here rather than passed to the
    # client, and the final 200 is stored under this request's key, so once a
    # tarball is cached it is served directly without asking Galaxy at all.
    location ~ ^/api/v3/plugin/ansible/content/[^/]+/collections/artifacts/ {
        proxy_cache_valid 200 60d;
        proxy_intercept_errors on;
        recursive_error_pages on;
        error_page 301 302 303 307 308 = @galaxy_redirect;
        proxy_pass https://galaxy.ansible.com;
    }

    location @galaxy_redirect {
        set $redirect_url $upstream_http_location;
        # Relative redirects are relative to Galaxy.
        if ($redirect_url ~ ^/) {
            set $redirect_url https://galaxy.ansible.com$redirect_url;
        }

        proxy_cache_valid 200 60d;

        # Follow further hops (nginx caps this at 10).
        proxy_intercept_errors on;
        recursive_error_pages on;
        error_page 301 302 303 307 308 = @galaxy_redirect;

        # Overrides the server-level headers; S3 must see its own Host or the
        # signature check fails.
        proxy_set_header Host $proxy_host;

        proxy_pass $redirect_url;

        add_header X-Cache-Status "REDIRECT-FETCH-$upstream_cache_status" always;
    }
}
