proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=repo_cache:100m max_size=50g inactive=60d use_temp_path=off;

server {
    listen 80;
    server_name package_cache;

    access_log /dev/stdout;

    resolver 8.8.8.8 1.1.1.1 valid=300s ipv6=off;

    location / {
        # Catch 302 redirects from Pulp and send them to custom block below
        proxy_intercept_errors on;
        error_page 301 302 307 = @handle_redirect;

        # --- Metadata Caching ---
        # Handles the 200 OK responses, repo indices, metadata etc
        proxy_cache repo_cache;
        proxy_cache_valid 200 60d;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

        # --- Upstream Connection ---
        proxy_pass https://ark.stackhpc.com;
        proxy_set_header Authorization "Basic <base64 encoded auth here>";

        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host ark.stackhpc.com;
        proxy_set_header X-Real-IP $remote_addr;

        add_header X-Cache-Status $upstream_cache_status;
    }

    location @handle_redirect {
        # Get S3 URL that Pulp provided in the Location header
        set $s3_url $upstream_http_location;

        # Set up the cache for the RPM
        proxy_cache repo_cache;
        proxy_cache_valid 200 60d;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_cache_lock on;

        # S3 URLs contain expiring tokens (e.g., X-Amz-Expires=3600).
        # If we use the S3 URL as the cache key, it will change every hour and break the cache.
        # This forces Nginx to use the original requested path (e.g., /pulp/.../foo.rpm) as the key.
        proxy_cache_key $scheme$server_name$request_uri;

        # Fetch from S3
        proxy_pass $s3_url;

        proxy_ssl_server_name on;

        # Identify that this came through the redirect block
        add_header X-Cache-Status "S3-FETCH-$upstream_cache_status";
    }
}
