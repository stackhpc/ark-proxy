# Pull-through cache for PyPI (pypi.org + files.pythonhosted.org).
#
# Point pip at http://<cache-host>:8081/simple/ and mark the host trusted
# (plain HTTP).
#
# Reuses the repo_cache zone defined in default.conf. Keys are prefixed with
# "pypi" so they can't collide with Ark or Galaxy entries.

server {
    listen 8081;
    server_name pypi_cache;

    access_log /dev/stdout;

    resolver 8.8.8.8 1.1.1.1 valid=300s ipv6=off;

    # --- Caching behaviour (inherited by all locations) ---
    proxy_cache repo_cache;
    proxy_cache_key pypi$request_uri;
    proxy_cache_lock on;
    proxy_cache_revalidate on;
    proxy_cache_background_update on;
    # Serve whatever we have, however old, if PyPI is erroring, timing out or
    # rate limiting us.
    proxy_cache_use_stale error timeout updating http_429 http_500 http_502 http_503 http_504;
    proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
    proxy_hide_header Set-Cookie;
    proxy_read_timeout 300s;

    # --- Upstream connection ---
    proxy_ssl_server_name on;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;
    # Uncompressed responses so sub_filter can rewrite them.
    proxy_set_header Accept-Encoding "";

    add_header X-Cache-Status $upstream_cache_status always;

    # --- Index pages: /simple/ and /simple/<project>/ ---
    # Short TTL so new releases show up; stale copies cover outages.
    location /simple/ {
        proxy_cache_valid 200 301 302 10m;

        # pip prefers the JSON index (PEP 691) and PyPI varies on Accept.
        # Always ask for HTML (PEP 503, which pip fully supports) so there is
        # one format to cache and rewrite.
        proxy_set_header Accept "text/html";
        proxy_set_header Host pypi.org;

        # PyPI links files absolutely on files.pythonhosted.org. Rewrite them
        # to this cache, per request, so cached pages work for any client
        # hostname.
        sub_filter_once off;
        sub_filter "https://files.pythonhosted.org/packages/" "$scheme://$http_host/packages/";
        # Name-normalisation redirects (/simple/Foo/ -> /simple/foo/).
        proxy_redirect https://pypi.org/ $scheme://$http_host/;

        proxy_pass https://pypi.org;
    }

    # --- Package files and PEP 658 .metadata files ---
    # Immutable: the path contains a hash of the content.
    location /packages/ {
        proxy_cache_valid 200 365d;
        proxy_set_header Host files.pythonhosted.org;
        proxy_pass https://files.pythonhosted.org;
    }
}
